<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Emerald Heritage) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Regal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#fde68a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Emerald Aura -->
    <radialGradient id="emeraldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&amp;family=Inter:wght@600;700;800&amp;display=swap');
      .ar-title { font-family: 'Amiri', 'Traditional Arabic', serif; font-weight: 700; fill: url(#goldGrad); }
      .latin-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #a7f3d0; letter-spacing: 2px; }
      .latin-sub2 { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #fde68a; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.85" />
  <rect width="480" height="480" x="16" y="16" rx="92" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.35" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="235" r="190" fill="url(#emeraldAura)" />

  <!-- Geometric 8-Point Star Border (Rub el Hizb) Background -->
  <g transform="translate(256, 220) scale(0.85)" opacity="0.15">
    <rect x="-140" y="-140" width="280" height="280" fill="none" stroke="url(#goldGrad)" stroke-width="4" rx="12" />
    <rect x="-140" y="-140" width="280" height="280" fill="none" stroke="url(#goldGrad)" stroke-width="4" rx="12" transform="rotate(45)" />
    <circle r="120" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  </g>

  <!-- Open Book Vector Motif -->
  <g transform="translate(256, 175)">
    <!-- Book Shadow -->
    <path d="M-92,42 C-45,28 -12,38 0,48 C12,38 45,28 92,42 L84,-38 C42,-50 12,-42 0,-32 C-12,-42 -42,-50 -84,-38 Z" fill="#022c22" opacity="0.6" />
    <!-- Left Page -->
    <path d="M0,42 C-20,30 -55,22 -95,35 L-88,-48 C-50,-58 -18,-50 0,-40 Z" fill="#f8fafc" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Right Page -->
    <path d="M0,42 C20,30 55,22 95,35 L88,-48 C50,-58 18,-50 0,-40 Z" fill="#f1f5f9" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Spine Line -->
    <line x1="0" y1="-40" x2="0" y2="44" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <!-- Book Lines (Script simulation) -->
    <path d="M-72,-28 C-48,-35 -24,-30 -12,-24 M-72,-12 C-48,-19 -24,-14 -12,-8 M-72,4 C-48,-3 -24,2 -12,8" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <path d="M12,-24 C24,-30 48,-35 72,-28 M12,-8 C24,-14 48,-19 72,-12 M12,8 C24,2 48,-3 72,4" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Main Arabic Title -->
  <text x="256" y="325" font-size="52" text-anchor="middle" class="ar-title" dir="rtl">الدرر السنية</text>
  <text x="256" y="365" font-size="28" text-anchor="middle" class="ar-title" dir="rtl">في الأجوبة النجدية</text>

  <!-- Divider Line -->
  <line x1="160" y1="395" x2="352" y2="395" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.75" />

  <!-- Latin Text -->
  <text x="256" y="432" text-anchor="middle" class="latin-sub">AL-DURAR AL-SANIYYAH</text>
  <text x="256" y="460" text-anchor="middle" class="latin-sub2">MAKTABAH MAFTOOhaH</text>
</svg>